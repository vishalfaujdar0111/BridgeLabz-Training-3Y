<!DOCTYPE html>
<html lang="en">
<head>

<div class="col-12 col-sm-6 col-md-3"><article class="card product-card shadow-sm h-100"><img src="https://placehold.co/500x350?text=Smart+Watch" class="card-img-top" alt="Smart Watch"><div class="card-body"><h2 class="h5">Smart Watch</h2><p class="fw-bold">₹2,499</p><button class="btn btn-primary">Add to Cart</button></div></article></div>
