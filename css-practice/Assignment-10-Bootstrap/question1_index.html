<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Landing Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bg-dark text-white">
  <nav class="navbar navbar-expand-md navbar-dark container py-3">
    <a class="navbar-brand fw-bold" href="#">TechNova</a>
    <div class="ms-auto d-flex gap-3">
      <a class="nav-link text-white" href="#home">Home</a>
      <a class="nav-link text-white" href="#about">About</a>
      <a class="nav-link text-white" href="#contact">Contact</a>
    </div>
  </nav>
</header>
<main id="home">
  <section class="hero d-flex align-items-center">
    <div class="container">
      <!-- Bootstrap row and columns make the hero responsive -->
      <div class="row align-items-center">
        <div class="col-md-7">
          <h1 class="display-4 fw-bold">Build Better Digital Experiences</h1>
          <p class="lead">TechNova helps startups create simple, fast and modern products.</p>
          <a class="btn btn-primary btn-lg" href="#about">Get Started</a>
        </div>
        <div class="col-md-5 mt-4 mt-md-0 text-center">
          <div class="p-5 bg-light text-dark rounded shadow">Startup Solutions</div>
        </div>
      </div>
    </div>
  </section>
  <section id="about" class="container py-5"><h2>About Us</h2><p>We build practical technology solutions for growing businesses.</p></section>
</main>
<footer id="contact" class="bg-dark text-white text-center py-3">contact@technova.example</footer>
</body></html>
