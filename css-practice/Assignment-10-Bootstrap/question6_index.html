<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light"><header class="bg-dark text-white text-center py-4"><h1>Notifications Dashboard</h1></header>
<main class="container py-5"><section class="card shadow-sm"><div class="card-body">
<h2 class="card-title mb-4">Your Notifications</h2>
<div class="alert alert-success">You have 2 new messages.</div>
<div class="alert alert-info">Tip: Complete your profile to improve visibility.</div>
<div class="alert alert-danger alert-dismissible fade show" role="alert">Warning: Your password will expire soon.
<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>
<!-- Bootstrap 5 has no old 'well', so a bordered bg-light section is used as required -->
<section class="summary bg-light border rounded p-4 mt-4"><h3 class="h5">Summary</h3><p class="mb-0">3 notifications need your attention today.</p></section>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script></body></html>
