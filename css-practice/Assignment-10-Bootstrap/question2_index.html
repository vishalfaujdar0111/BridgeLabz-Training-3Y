<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">
<header class="container text-center p-5">
  <h1 class="fw-bold">Vishal Faujdar</h1>
  <p class="lead mb-3">Computer Science Student & Web Developer</p>
</header>
<main class="container text-center">
  <section class="mt-4">
    <img class="img-fluid rounded-circle profile mb-3" src="https://placehold.co/220x220?text=Profile" alt="Profile">
    <div class="mb-3">
      <!-- Bootstrap button utilities -->
      <a class="btn btn-primary me-2" href="#contact">Hire Me</a>
      <a class="btn btn-outline-dark" href="#">Download CV</a>
    </div>
  </section>
  <section id="contact" class="p-5 bg-white rounded shadow-sm mx-auto form-box">
    <h2 class="fw-bold mb-3">Contact Me</h2>
    <form>
      <input class="form-control mb-3" type="text" placeholder="Your name">
      <input class="form-control mb-3" type="email" placeholder="Your email">
      <textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </section>
</main>
<footer class="text-center py-4 mt-4">© 2026 Vishal</footer>
</body></html>
