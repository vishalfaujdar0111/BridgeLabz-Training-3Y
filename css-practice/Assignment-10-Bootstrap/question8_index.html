<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body><header class="text-center py-5 bg-light"><h1>Choose Your Plan</h1><p class="lead">Simple pricing for every stage.</p></header>
<main class="container py-5"><section class="row g-4"><div class="col-md-4"><article class="card pricing-card h-100 shadow-sm "><div class="card-body text-center"><h2>Basic</h2><p class="display-6 fw-bold">₹499/month</p><ul class="list-unstyled"><li class='py-2'>1 Project</li><li class='py-2'>5 GB Storage</li><li class='py-2'>Email Support</li></ul><button class="btn btn-primary">Choose Plan</button></div></article></div><div class="col-md-4"><article class="card pricing-card h-100 shadow-sm bg-primary text-white"><div class="card-body text-center"><h2>Pro</h2><p class="display-6 fw-bold">₹999/month</p><ul class="list-unstyled"><li class='py-2'>10 Projects</li><li class='py-2'>50 GB Storage</li><li class='py-2'>Priority Support</li></ul><button class="btn btn-light">Choose Plan</button></div></article></div><div class="col-md-4"><article class="card pricing-card h-100 shadow-sm "><div class="card-body text-center"><h2>Business</h2><p class="display-6 fw-bold">₹1,999/month</p><ul class="list-unstyled"><li class='py-2'>Unlimited Projects</li><li class='py-2'>200 GB Storage</li><li class='py-2'>24/7 Support</li></ul><button class="btn btn-primary">Choose Plan</button></div></article></div></section></main></body></html>
