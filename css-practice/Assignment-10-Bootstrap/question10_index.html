<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Agency</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body><header class="bg-dark text-white text-center py-4"><h1>WanderWorld Travels</h1><p class="mb-0">Discover your next destination</p></header>
<main>
<section class="container py-5">
<div id="travelCarousel" class="carousel slide shadow" data-bs-ride="carousel">
<div class="carousel-inner">
<div class="carousel-item active" data-bs-interval="2500"><img src="https://placehold.co/1200x550/335/fff?text=Goa" class="d-block w-100" alt="Goa"><div class="carousel-caption"><h2>Goa</h2><p>Beaches, sunsets and unforgettable weekends.</p></div></div>
<div class="carousel-item" data-bs-interval="3500"><img src="https://placehold.co/1200x550/174/fff?text=Manali" class="d-block w-100" alt="Manali"><div class="carousel-caption"><h2>Manali</h2><p>Mountains, snow and fresh air.</p></div></div>
<div class="carousel-item" data-bs-interval="4500"><img src="https://placehold.co/1200x550/057/fff?text=Jaipur" class="d-block w-100" alt="Jaipur"><div class="carousel-caption"><h2>Jaipur</h2><p>Explore forts, culture and colorful streets.</p></div></div>
</div><button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
<button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button></div>
<section class="mt-5"><h2 class="h4">Booking Completion</h2><div class="progress" role="progressbar" aria-label="Booking completion" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">
<div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div></div></section>
</section></main>
<footer class="bg-dark text-white text-center p-4"><p class="mb-1">WanderWorld Travels</p><p class="mb-0">Email: travel@example.com | Phone: +91 98765 43210</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script></body></html>
