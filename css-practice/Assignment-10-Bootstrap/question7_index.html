<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light"><header class="bg-primary text-white py-4"><div class="container d-flex justify-content-between align-items-center"><h1 class="h2 mb-0">Task Tracker</h1><span class="badge bg-light text-dark">Pending 4</span></div></header>
<main class="container py-5"><section class="card shadow-sm"><div class="card-body"><h2 class="h4 mb-3">Today's Tasks</h2>
<ul class="list-group">
<li class="list-group-item d-flex justify-content-between align-items-center">Finish Bootstrap assignment <span class="badge bg-danger">High</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center">Practice grid system <span class="badge bg-warning text-dark">Medium</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center">Update portfolio <span class="badge bg-success">Low</span></li>
<li class="list-group-item d-flex justify-content-between align-items-center">Read class notes <span class="badge bg-warning text-dark">Medium</span></li>
</ul>
<!-- Button contains an embedded Bootstrap badge -->
<button class="btn btn-success mt-4">Completed <span class="badge bg-light text-success">2</span></button>
</div></section></main></body></html>
