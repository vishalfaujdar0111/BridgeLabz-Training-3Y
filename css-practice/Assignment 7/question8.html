<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="question8.css">
</head>
<body>
    <header><h1>Box Model Exploration</h1></header>

    <main class="page">
        <section class="model">
            <div class="margin-layer">
                <div class="border-layer">
                    <div class="padding-layer">
                        <div class="content-layer">
                            Content
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="description">
            <p><strong>Content:</strong> The actual text or element.</p>
            <p><strong>Padding:</strong> Space inside the border.</p>
            <p><strong>Border:</strong> The line around the padding.</p>
            <p><strong>Margin:</strong> Space outside the border.</p>
            <p><strong>box-sizing: border-box:</strong> Includes padding and border inside the set width and height.</p>
        </section>
    </main>

    <footer><p>Box Model Practice</p></footer>
</body>
</html>
