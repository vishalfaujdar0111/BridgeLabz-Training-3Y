<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chatbot {
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .chat-box {
            height: 380px;
            padding: 15px;
            overflow-y: auto;
        }

        .message {
            padding: 10px 14px;
            margin: 10px 0;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .bot {
            background: #e5e7eb;
            color: #222;
            margin-right: auto;
        }

        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }

        button {
            margin-left: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 20px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

    <div class="chatbot">

        <div class="header">
            🤖 My Chatbot
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">
                Hello! 👋 How can I help you?
            </div>
        </div>

        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type a message..."
                onkeypress="handleKey(event)"
            >

            <button onclick="sendMessage()">Send</button>
        </div>

    </div>


    <script>

        function sendMessage() {

            let input = document.getElementById("userInput");
            let message = input.value.trim();

            if (message === "") {
                return;
            }

            // Display user message
            addMessage(message, "user");

            input.value = "";

            // Bot response
            setTimeout(function() {

                let reply = getBotReply(message);

                addMessage(reply, "bot");

            }, 500);
        }


        function addMessage(message, type) {

            let chatBox = document.getElementById("chatBox");

            let div = document.createElement("div");

            div.classList.add("message", type);

            div.innerText = message;

            chatBox.appendChild(div);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        function getBotReply(message) {

            message = message.toLowerCase();

            if (message.includes("hello") || message.includes("hi")) {
                return "Hello! 😊 Nice to meet you.";
            }

            if (message.includes("name")) {
                return "My name is My Chatbot 🤖";
            }

            if (message.includes("how are you")) {
                return "I am doing great! How about you?";
            }

            if (message.includes("html")) {
                return "HTML is used to create the structure of web pages.";
            }

            if (message.includes("css")) {
                return "CSS is used to style and design web pages.";
            }

            if (message.includes("javascript") || message.includes("js")) {
                return "JavaScript is used to add functionality and interactivity.";
            }

            if (message.includes("bye")) {
                return "Goodbye! 👋 Have a nice day.";
            }

            return "Sorry, I don't understand that yet. 🤔";
        }


        function handleKey(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }

    </script>

</body>
</html>
