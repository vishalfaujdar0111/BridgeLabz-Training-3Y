<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <link rel="stylesheet" href="complete.css">
</head>
<body>
<header>
    <h1>My Website</h1>
    <nav>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Welcome to My Website</h2>
</section>

<section id="about" class="about">
    <div>
        <h2>About Me</h2>
        <p>I am learning web development and I enjoy creating simple websites.</p>
    </div>
    <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=500&q=70" alt="Office">
</section>

<section id="services" class="services">
    <h2>Services</h2>
    <div class="service-list">
        <div><h3>Web Design</h3><p>Simple website design.</p></div>
        <div><h3>HTML</h3><p>HTML webpage development.</p></div>
        <div><h3>CSS</h3><p>Basic CSS styling.</p></div>
    </div>
</section>

<section id="contact" class="contact">
    <h2>Contact</h2>
    <form>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <textarea rows="4" placeholder="Message"></textarea>
        <button>Send</button>
    </form>
</section>

<footer>© 2026 My Website</footer>
</body>
</html>
