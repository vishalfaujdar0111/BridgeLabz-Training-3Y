<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="Filter_Comparison_Layout.css">
</head>
<body>
<header>
    <h1>Filter Comparison</h1>
</header>

<main class="comparison">
    <figure>
        <img src="https://picsum.photos/id/1015/700/450" alt="Original mountain landscape">
        <figcaption>Before – Original Image</figcaption>
    </figure>

    <figure>
        <img class="filtered" src="https://picsum.photos/id/1015/700/450" alt="Filtered mountain landscape">
        <figcaption>After – Filtered Image</figcaption>
    </figure>
</main>

<footer>
    <p>Hover over the filtered image to reveal the original.</p>
</footer>
</body>
</html>
