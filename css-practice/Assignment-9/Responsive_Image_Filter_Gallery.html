<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive_Image_Filter_Gallery.css">
</head>
<body>
<header>
    <h1>Responsive Image Filter Gallery</h1>
</header>

<main>
    <section class="gallery" aria-label="Filtered image gallery">
        <figure class="gallery-item">
            <img class="blur" src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
            <figcaption>Blur Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="grayscale" src="https://picsum.photos/id/1016/600/400" alt="Forest landscape">
            <figcaption>Grayscale Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="sepia" src="https://picsum.photos/id/1025/600/400" alt="Dog portrait">
            <figcaption>Sepia Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="brightness" src="https://picsum.photos/id/1035/600/400" alt="River landscape">
            <figcaption>Brightness Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="contrast" src="https://picsum.photos/id/1043/600/400" alt="Nature landscape">
            <figcaption>Contrast Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img class="hue" src="https://picsum.photos/id/1069/600/400" alt="Building architecture">
            <figcaption>Hue-Rotate Filter</figcaption>
        </figure>
    </section>
</main>

<footer>
    <p>Responsive CSS Practice</p>
</footer>
</body>
</html>
