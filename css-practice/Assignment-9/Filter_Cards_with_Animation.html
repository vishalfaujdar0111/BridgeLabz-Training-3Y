<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="Filter_Cards_with_Animation.css">
</head>
<body>
<header>
    <h1>Profile Cards</h1>
</header>

<main class="profiles">
    <article class="profile-card">
        <img class="grayscale" src="https://i.pravatar.cc/500?img=12" alt="Profile illustration of Alex">
        <div><h2>Alex</h2><p>UI Designer</p></div>
    </article>
    <article class="profile-card">
        <img class="sepia" src="https://i.pravatar.cc/500?img=32" alt="Profile illustration of Sam">
        <div><h2>Sam</h2><p>Web Developer</p></div>
    </article>
    <article class="profile-card">
        <img class="contrast" src="https://i.pravatar.cc/500?img=47" alt="Profile illustration of Jordan">
        <div><h2>Jordan</h2><p>Content Creator</p></div>
    </article>
</main>

<footer>
    <p>Hover over a card to remove the image filter.</p>
</footer>
</body>
</html>
