<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Tooltips</title><link rel="stylesheet" href="Q2.css"></head>
<body>
<header><h1>Tooltip Demonstration</h1></header>
<main class="tooltip-area">
    <section class="tip"><span>HTML</span><div class="tooltip">Structure of a webpage</div></section>
    <section class="tip"><span>CSS</span><div class="tooltip">Styles a webpage</div></section>
    <section class="tip"><span>Grid</span><div class="tooltip">Two-dimensional layout system</div></section>
    <section class="tip"><span>Flexbox</span><div class="tooltip">One-dimensional layout system</div></section>
</main>
<footer><p>Hover over each word</p></footer>
</body>
</html>
