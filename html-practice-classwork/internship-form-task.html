<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
</head>

<body>

    <h1>Internship Application Form</h1>

    <form>

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
            <br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" required>
            <br><br>
        </fieldset>

        <br>

        <!-- Gender -->
        <fieldset>
            <legend>Gender</legend>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </fieldset>

        <br>

        <!-- Course -->
        <fieldset>
            <legend>Course</legend>

            <label for="course">Select your course:</label>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="Mechanical">Mechanical</option>
            </select>
        </fieldset>

        <br>

        <!-- Skills -->
        <fieldset>
            <legend>Skills</legend>

            <input type="checkbox" id="java" name="skills" value="Java">
            <label for="java">Java</label>

            <input type="checkbox" id="javascript" name="skills" value="JavaScript">
            <label for="javascript">JavaScript</label>

            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="react" name="skills" value="React">
            <label for="react">React</label>
        </fieldset>

        <br>

        <!-- Internship Preference -->
        <fieldset>
            <legend>Internship Preference</legend>

            <input type="radio" id="onsite" name="preference" value="On-site">
            <label for="onsite">On-site</label>

            <input type="radio" id="remote" name="preference" value="Remote">
            <label for="remote">Remote</label>

            <input type="radio" id="hybrid" name="preference" value="Hybrid">
            <label for="hybrid">Hybrid</label>
        </fieldset>

        <br>

        <!-- Resume -->
        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" required>

        <br><br>

        <!-- Cover Letter -->
        <label for="coverletter">Cover Letter:</label>
        <br>
        <textarea id="coverletter" name="coverletter"
                  rows="6" cols="50"
                  placeholder="Write your cover letter here..."
                  required></textarea>

        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
