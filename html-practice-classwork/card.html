<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            font-family: Georgia, "Times New Roman", serif;
        }

        .card {
            width: 380px;
            background: white;
            border: 1px solid #ddd;
            padding: 9px 9px 18px;
            text-align: center;
        }

        .image-box {
            position: relative;
            width: 100%;
            height: 425px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #383838;
            color: white;
            padding: 7px 11px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
        }

        .brand {
            margin-top: 13px;
            color: #a07d3e;
            font-size: 16px;
            font-weight: bold;
        }

        .title {
            margin-top: 6px;
            color: #444;
            font-size: 18px;
            line-height: 1.25;
        }

        .rating {
            display: inline-block;
            margin-top: 10px;
            background: #b83b3b;
            color: white;
            padding: 7px 11px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
        }

        .price {
            margin-top: 14px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
        }

        .old-price {
            margin-left: 5px;
            color: #555;
            text-decoration: line-through;
            font-weight: normal;
        }

        .discount {
            margin-left: 4px;
            color: #a47734;
            font-weight: normal;
        }

        .offer {
            margin-top: 11px;
            color: #2da34a;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
        }

        .offer::before {
            content: "%";
            display: inline-flex;
            width: 16px;
            height: 16px;
            margin-right: 5px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #36ad50;
            color: white;
            font-size: 10px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="image-box">
            <img src="boy.png" alt="Men Kurta">

            <div class="badge">
                BESTSELLER
            </div>
        </div>

        <div class="brand">
            SHOOLIN
        </div>

        <div class="title">
            Men Geometric Print Regular Fit Short Kurta
        </div>

        <div class="rating">
            2.9 ★ | 24
        </div>

        <div class="price">
            ₹340

            <span class="old-price">
                ₹1,999
            </span>

            <span class="discount">
                (83% off)
            </span>
        </div>

        <div class="offer">
            Offer Price: ₹306
        </div>

    </div>

</body>
</html>
