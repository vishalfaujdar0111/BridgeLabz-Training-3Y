<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="pricing.css">
</head>
<body>
<main>
    <h1>Pricing Plans</h1>

    <div class="plans">
        <div class="plan">
            <h2>Basic</h2>
            <p class="price">₹499</p>
            <ul>
                <li>5 Projects</li>
                <li>Basic Support</li>
                <li>10 GB Storage</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan popular">
            <h2>Standard</h2>
            <p class="price">₹999</p>
            <ul>
                <li>15 Projects</li>
                <li>Priority Support</li>
                <li>50 GB Storage</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <p class="price">₹1499</p>
            <ul>
                <li>Unlimited Projects</li>
                <li>24/7 Support</li>
                <li>100 GB Storage</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>
    </div>
</main>
</body>
</html>
