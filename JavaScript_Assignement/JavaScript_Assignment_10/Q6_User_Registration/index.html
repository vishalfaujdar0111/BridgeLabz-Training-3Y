<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q6 - User Registration</title><link rel="stylesheet" href="../styles.css"></head>
<body><main>
<header><h1>User Registration</h1><p class="muted">We check whether your email is already registered before creating an account.</p></header>
<form id="register-form">
<div class="toolbar"><label for="name">Full name</label><input id="name" name="name" required placeholder="Your name"></div>
<div class="toolbar"><label for="email">Email</label><input id="email" name="email" type="email" required placeholder="name@example.com"></div>
<div class="toolbar"><label for="course">Course</label><input id="course" name="course" required placeholder="e.g. BCA"></div>
<button type="submit" id="submit">Register</button>
</form><p id="message" aria-live="polite"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="app.js"></script></body></html>
