<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q3 - Task Manager</title><link rel="stylesheet" href="../styles.css"></head>
<body><main>
<header><h1>Task Manager</h1><p class="muted">Filter tasks by priority or completion, and update completion status.</p></header>
<div class="toolbar"><label for="filter">Show tasks</label><select id="filter"><option value="all">All tasks</option><option value="low">Low Priority</option><option value="medium">Medium Priority</option><option value="high">High Priority</option><option value="completed">Completed</option></select></div>
<p id="message" aria-live="polite"></p><ul id="tasks"></ul>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="app.js"></script></body></html>
