<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Form Validation | Assignment 9</title>
  <link rel="stylesheet" href="../styles.css">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
<header>
  <p class="muted">Assignment 9 · jQuery</p>
  <h1>Registration Form Validation</h1>
  <p class="subtitle">Validate required fields, email format and uniqueness, and password length.</p>
</header>
<main>
<section class="panel"><h2>Create your account</h2>
<form id="registration" novalidate>
  <p><label for="name">Full name</label><br><input id="name" name="name" autocomplete="name" required></p>
  <p><label for="email">Email address</label><br><input id="email" name="email" type="email" autocomplete="email" required></p>
  <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="new-password" required></p>
  <button type="submit">Register</button>
  <p id="form-message" aria-live="polite"></p>
</form></section>
</main>
<footer>Assignment 9 · Individual question demonstration</footer>
</body>
</html>
