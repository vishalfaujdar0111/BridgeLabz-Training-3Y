<html lang="en">

<body>
<header>
  <p class="muted">Assignment 9 · jQuery</p>
  <h1>Welcome Page Greeting</h1>
  <p class="subtitle">A time-aware greeting with interactive controls.</p>
</header>
<main>
<section class="panel" aria-labelledby="welcome-heading">
  <h2 id="welcome-heading">Welcome!</h2>
  <p id="greeting" aria-live="polite">Your greeting will appear here.</p>
  <p id="welcome-message">We’re glad you’re here. Explore, learn, and make today count.</p>
  <button id="change-greeting">Change Greeting</button>
  <button id="toggle-welcome" class="secondary">Toggle Welcome Message</button>

</main>
<footer>Assignment 9 · Individual question demonstration</footer>
