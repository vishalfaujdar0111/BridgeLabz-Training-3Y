<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Registration Form</h1>
    <p id="stepLabel">Step 1 of 3: Name</p>
    <form id="multiStepForm" novalidate>
      <section class="step active" data-step="0">
        <label for="fullName">Name</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" required>
        <small class="error" id="nameError"></small>
      </section>
      <section class="step" data-step="1" hidden>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <small class="error" id="emailError"></small>
      </section>
      <section class="step" data-step="2" hidden>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
        <small class="error" id="passwordError"></small>
      </section>
      <div class="actions">
        <button id="backButton" type="button" disabled>Back</button>
        <button id="nextButton" type="button">Next</button>
      </div>
    </form>
    <section id="summary" hidden>
      <h2>Form Completed Successfully!</h2>
      <p id="summaryName"></p><p id="summaryEmail"></p>
      <button id="startAgain" type="button">Start Again</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
