<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Image Gallery</h1>
    <p>Click any image to preview it.</p>
    <div class="gallery" id="gallery">
      <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
      <img src="https://picsum.photos/id/1025/600/400" alt="Dog portrait">
      <img src="https://picsum.photos/id/1035/600/400" alt="Forest landscape">
      <img src="https://picsum.photos/id/1043/600/400" alt="Coastal landscape">
      <img src="https://picsum.photos/id/106/600/400" alt="Waterfall landscape">
      <img src="https://picsum.photos/id/1074/600/400" alt="Nature landscape">
    </div>
  </main>
  <div class="modal" id="imageModal" aria-hidden="true">
    <div class="modal-content" id="modalContent">
      <button class="close" id="closeModal" type="button" aria-label="Close">×</button>
      <img id="previewImage" src="" alt="Enlarged gallery preview">
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
